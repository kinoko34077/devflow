name: Repository Projection shadow

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  shadow:
    runs-on: ubuntu-latest
    concurrency:
      group: repository-projection-shadow-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'
      - name: Run read-only fleet shadow
        env:
          MAINTENANCE_AUDIT_TOKEN: ${{ secrets.MAINTENANCE_AUDIT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$MAINTENANCE_AUDIT_TOKEN" ]]; then
            echo "fleet shadow requires the preconfigured MAINTENANCE_AUDIT_TOKEN secret" >&2
            exit 2
          fi
          python scripts/repository_projection_shadow.py \
            --token-env MAINTENANCE_AUDIT_TOKEN \
            --output repository-projection-shadow.json
      - name: Write fleet shadow summary
        if: always() && hashFiles('repository-projection-shadow.json') != ''
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path("repository-projection-shadow.json").read_text(encoding="utf-8"))
          print("## Repository Projection fleet shadow")
          for key in (
              "repository_count",
              "source_unavailable_count",
              "open_issue_count",
              "machine_record_count",
              "machine_task_count",
              "legacy_hint_count",
              "unclassified_count",
              "invalid_metadata_count",
              "legacy_or_unclassified_rate",
              "repositories_with_machine_tasks",
              "repositories_with_control_active_work",
          ):
              print(f"- {key}: {report.get(key)}")
          PY
      - name: Upload fleet shadow report
        if: always() && hashFiles('repository-projection-shadow.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repository-projection-shadow
          path: repository-projection-shadow.json
