name: Maintenance audit

on:
  schedule:
    - cron: '30 13 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Maintenance operation mode
        type: choice
        required: true
        default: audit
        options:
          - audit
          - maintenance-select
          - projection-shadow
          - publish
          - projection-cache
      repository:
        description: Optional owner/name target
        required: false
        type: string
      control:
        description: Required Control issue number for targeted operations
        required: false
        type: string
      owner:
        description: Existing owner/repository#issue for manual supply publication
        required: false
        type: string
      work_class:
        description: Existing-owner work class for manual publication
        required: false
        type: choice
        default: sync-check
        options:
          - audit
          - triage
          - sync-check
          - quickfix
          - implementation
      attempt_id:
        description: Publisher execution-attempt identifier for 3C fencing
        required: false
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: read
  actions: read

jobs:
  audit:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '30 13 * * *') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'audit') }}
    runs-on: ubuntu-latest
    concurrency:
      group: maintenance-audit-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'
      - name: Run read-only maintenance audit
        env:
          MAINTENANCE_AUDIT_TOKEN: ${{ secrets.MAINTENANCE_AUDIT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          AUDIT_REPOSITORY: ${{ inputs.repository }}
          AUDIT_CONTROL: ${{ inputs.control }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$AUDIT_REPOSITORY" ]]; then
            if [[ -z "$AUDIT_CONTROL" ]]; then
              echo "single-repository mode requires control issue number" >&2
              exit 2
            fi
            if [[ "$AUDIT_REPOSITORY" == "kinoko34077/devflow" ]]; then
              python scripts/maintenance_audit.py repository \
                --repository "$AUDIT_REPOSITORY" \
                --control "$AUDIT_CONTROL" \
                --token-env GITHUB_TOKEN \
                --output maintenance-audit-report.json
            else
              if [[ -z "$MAINTENANCE_AUDIT_TOKEN" ]]; then
                echo "cross-repository targeted audit requires the preconfigured MAINTENANCE_AUDIT_TOKEN secret" >&2
                exit 2
              fi
              python scripts/maintenance_audit.py repository \
                --repository "$AUDIT_REPOSITORY" \
                --control "$AUDIT_CONTROL" \
                --token-env MAINTENANCE_AUDIT_TOKEN \
                --output maintenance-audit-report.json
            fi
          else
            if [[ -z "$MAINTENANCE_AUDIT_TOKEN" ]]; then
              echo "portfolio audit requires the preconfigured MAINTENANCE_AUDIT_TOKEN secret" >&2
              exit 2
            fi
            python scripts/maintenance_audit.py portfolio \
              --token-env MAINTENANCE_AUDIT_TOKEN \
              --triage \
              --output maintenance-audit-report.json
          fi
      - name: Write aggregate summary
        if: always() && hashFiles('maintenance-audit-report.json') != ''
        run: >-
          python scripts/maintenance_audit.py summarize
          --input maintenance-audit-report.json
          >> "$GITHUB_STEP_SUMMARY"
      - name: Upload machine report
        if: always() && hashFiles('maintenance-audit-report.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maintenance-audit-report
          path: maintenance-audit-report.json


  projection-shadow:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'projection-shadow' }}
    runs-on: ubuntu-latest
    concurrency:
      group: repository-projection-shadow-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'
      - name: Run read-only Repository Projection fleet shadow
        env:
          MAINTENANCE_AUDIT_TOKEN: ${{ secrets.MAINTENANCE_AUDIT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$MAINTENANCE_AUDIT_TOKEN" ]]; then
            echo "projection shadow requires the preconfigured MAINTENANCE_AUDIT_TOKEN secret" >&2
            exit 2
          fi
          python scripts/repository_projection_shadow.py \
            --token-env MAINTENANCE_AUDIT_TOKEN \
            --output repository-projection-shadow.json
      - name: Write projection shadow summary
        if: always() && hashFiles('repository-projection-shadow.json') != ''
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path("repository-projection-shadow.json").read_text(encoding="utf-8"))
          print("## Repository Projection fleet shadow")
          for key in (
              "repository_count",
              "source_unavailable_count",
              "open_issue_count",
              "machine_record_count",
              "machine_task_count",
              "legacy_hint_count",
              "unclassified_count",
              "invalid_metadata_count",
              "untrusted_metadata_count",
              "legacy_or_unclassified_rate",
              "non_machine_metadata_count",
              "machine_metadata_coverage_rate",
              "repositories_with_machine_tasks",
              "repositories_with_open_issues_without_machine_tasks",
              "operator_decision_ambiguous_repository_count",
              "repositories_with_control_active_work_text",
          ):
              print(f"- {key}: {report.get(key)}")
          PY
      - name: Upload projection shadow report
        if: always() && hashFiles('repository-projection-shadow.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repository-projection-shadow
          path: repository-projection-shadow.json

  maintenance-select:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'maintenance-select' }}
    runs-on: ubuntu-latest
    concurrency:
      group: maintenance-select-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'
      - name: Select predefined maintenance read-only
        env:
          MAINTENANCE_AUDIT_TOKEN: ${{ secrets.MAINTENANCE_AUDIT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          SELECT_REPOSITORY: ${{ inputs.repository }}
          SELECT_CONTROL: ${{ inputs.control }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SELECT_REPOSITORY" || -z "$SELECT_CONTROL" ]]; then
            echo "maintenance-select requires repository and control" >&2
            exit 2
          fi
          TOKEN_ENV=MAINTENANCE_AUDIT_TOKEN
          if [[ "$SELECT_REPOSITORY" == "kinoko34077/devflow" ]]; then
            TOKEN_ENV=GITHUB_TOKEN
          elif [[ -z "$MAINTENANCE_AUDIT_TOKEN" ]]; then
            echo "cross-repository maintenance selection requires MAINTENANCE_AUDIT_TOKEN" >&2
            exit 2
          fi
          python scripts/maintenance_audit.py select-maintenance \
            --repository "$SELECT_REPOSITORY" \
            --control "$SELECT_CONTROL" \
            --token-env "$TOKEN_ENV" \
            --output maintenance-selection.json
      - name: Upload maintenance selection
        if: always() && hashFiles('maintenance-selection.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maintenance-selection
          path: maintenance-selection.json


  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'publish' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'
      - name: Publish or withdraw bounded existing-owner supply
        env:
          MAINTENANCE_SUPPLY_TOKEN: ${{ secrets.MAINTENANCE_SUPPLY_TOKEN }}
          SUPPLY_REPOSITORY: ${{ inputs.repository }}
          SUPPLY_CONTROL: ${{ inputs.control }}
          SUPPLY_OWNER: ${{ inputs.owner }}
          SUPPLY_WORK_CLASS: ${{ inputs.work_class }}
          SUPPLY_ATTEMPT_ID: ${{ inputs.attempt_id }}
        shell: bash
        run: |
          set -euo pipefail
          for value in \
            "$MAINTENANCE_SUPPLY_TOKEN" \
            "$SUPPLY_REPOSITORY" \
            "$SUPPLY_CONTROL" \
            "$SUPPLY_OWNER" \
            "$SUPPLY_WORK_CLASS" \
            "$SUPPLY_ATTEMPT_ID"
          do
            if [[ -z "$value" ]]; then
              echo "manual publish requires preconfigured token and all target inputs" >&2
              exit 2
            fi
          done
          python scripts/maintenance_audit.py publish-supply \
            --repository "$SUPPLY_REPOSITORY" \
            --control "$SUPPLY_CONTROL" \
            --owner "$SUPPLY_OWNER" \
            --work-class "$SUPPLY_WORK_CLASS" \
            --attempt-id "$SUPPLY_ATTEMPT_ID" \
            --token-env MAINTENANCE_SUPPLY_TOKEN \
            --apply \
            --output maintenance-supply-result.json
      - name: Upload supply result
        if: always() && hashFiles('maintenance-supply-result.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maintenance-supply-result
          path: maintenance-supply-result.json

  projection-cache:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 14 * * *') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'projection-cache') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    concurrency:
      group: repository-projection-cache-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'
      - name: Generate bounded Repository Projection cache
        env:
          MAINTENANCE_AUDIT_TOKEN: ${{ secrets.MAINTENANCE_AUDIT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          CACHE_REPOSITORY: ${{ inputs.repository }}
          CACHE_CONTROL: ${{ inputs.control }}
          CACHE_EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          for value in "$MAINTENANCE_AUDIT_TOKEN" "$GITHUB_TOKEN"
          do
            if [[ -z "$value" ]]; then
              echo "projection-cache requires configured read/write tokens" >&2
              exit 2
            fi
          done

          if [[ "$CACHE_EVENT_NAME" == "schedule" || ( -z "$CACHE_REPOSITORY" && -z "$CACHE_CONTROL" ) ]]; then
            python scripts/repository_projection_cache.py \
              --fleet \
              --read-token-env MAINTENANCE_AUDIT_TOKEN \
              --write-token-env GITHUB_TOKEN \
              --apply \
              --output repository-projection-cache-result.json
          elif [[ -n "$CACHE_REPOSITORY" && -n "$CACHE_CONTROL" ]]; then
            python scripts/repository_projection_cache.py \
              --repository "$CACHE_REPOSITORY" \
              --control "$CACHE_CONTROL" \
              --read-token-env MAINTENANCE_AUDIT_TOKEN \
              --write-token-env GITHUB_TOKEN \
              --apply \
              --output repository-projection-cache-result.json
          else
            echo "manual projection-cache mode requires both repository and control, or neither for fleet mode" >&2
            exit 2
          fi
      - name: Upload projection cache result
        if: always() && hashFiles('repository-projection-cache-result.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repository-projection-cache-result
          path: repository-projection-cache-result.json

