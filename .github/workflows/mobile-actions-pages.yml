name: Publish Mobile Actions Control

on:
  push:
    branches: [main]
    paths:
      - 'docs/mobile-actions/**'
      - 'tools/mobile_actions_snapshot.py'
      - '.github/workflows/mobile-actions-pages.yml'

# Dedicated Pages artifact contains ONLY the four UI files plus sanitized status.json.
# No Workflow Dispatch, repository write, credential or liveness enrollment.
permissions:
  contents: read

concurrency:
  group: devflow-mobile-actions-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'kinoko34077/devflow' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
      issues: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Verify mobile-only source and tests
        run: |
          python -m unittest tests.test_mobile_actions_control
          for f in index.html control.js style.css manifest.webmanifest; do
            test -f "docs/mobile-actions/$f"
            test ! -L "docs/mobile-actions/$f"
          done
      - name: Create isolated public artifact
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/mobile-actions-public"
          mkdir -p "$out"
          for f in index.html control.js style.css manifest.webmanifest; do
            cp -- "docs/mobile-actions/$f" "$out/$f"
          done
          test "$(find "$out" -type f | wc -l)" -eq 4
          test "$(find "$out" -type l | wc -l)" -eq 0
      - name: Generate sanitized, timestamped first-party status snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m tools.mobile_actions_snapshot --out "$RUNNER_TEMP/mobile-actions-public/status.json"
          python - "$RUNNER_TEMP/mobile-actions-public/status.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)
          assert report["schema"] == "devflow.mobile-actions-snapshot.v1"
          assert report["source"] == "github-actions-build"
          assert "token" not in report and "body" not in report
          PY
          test "$(find "$RUNNER_TEMP/mobile-actions-public" -type f | wc -l)" -eq 5
          test "$(find "$RUNNER_TEMP/mobile-actions-public" -type l | wc -l)" -eq 0
      - name: Upload exact isolated artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/mobile-actions-public

  deploy:
    needs: build
    if: github.repository == 'kinoko34077/devflow' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish public mobile-only site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
