name: Publish Mobile Actions Control and KAEP Issue List

on:
  push:
    branches: [main]
    paths:
      - 'docs/mobile-actions/**'
      - 'tools/mobile_actions_snapshot.py'
      - '.github/workflows/mobile-actions-pages.yml'
      - 'tools/kaep_issue_search_view.py'
      - 'tools/kaep_issue_list_html.py'
      - 'tools/kaep_public_index.py'
  workflow_dispatch:


# The single Pages artifact contains the existing five mobile files AND only
# kaep/index.html built from public, already redacted source metadata.
# Manual publication refresh is owner-only. No issue dispatch/write, secret,
# recurring schedule, new credential, or liveness enrollment.
permissions:
  contents: read

concurrency:
  group: devflow-mobile-actions-pages
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.repository == 'kinoko34077/devflow' &&
      github.ref == 'refs/heads/main' &&
      github.actor_id == '79015263' &&
      github.triggering_actor == 'kinoko34077'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
      issues: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Verify mobile-only source and tests
        run: |
          python -m unittest tests.test_mobile_actions_control
          for f in index.html control.js style.css manifest.webmanifest; do
            test -f "docs/mobile-actions/$f"
            test ! -L "docs/mobile-actions/$f"
          done
      - name: Create isolated public artifact
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/mobile-actions-public"
          mkdir -p "$out"
          for f in index.html control.js style.css manifest.webmanifest; do
            cp -- "docs/mobile-actions/$f" "$out/$f"
          done
          test "$(find "$out" -type f | wc -l)" -eq 4
          test "$(find "$out" -type l | wc -l)" -eq 0
      - name: Generate sanitized, timestamped first-party status snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m tools.mobile_actions_snapshot --out "$RUNNER_TEMP/mobile-actions-public/status.json"
          python - "$RUNNER_TEMP/mobile-actions-public/status.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)
          assert report["schema"] == "devflow.mobile-actions-snapshot.v1"
          assert report["source"] == "github-actions-build"
          assert "token" not in report and "body" not in report
          PY
          test "$(find "$RUNNER_TEMP/mobile-actions-public" -type f | wc -l)" -eq 5
          test "$(find "$RUNNER_TEMP/mobile-actions-public" -type l | wc -l)" -eq 0
      - name: Generate bounded public KAEP Issue list (GET-only)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/mobile-actions-public"
          mkdir -p "$out/kaep"
          set +e
          python -m tools.kaep_issue_search_view \
            --repository kinoko34077/devflow \
            --expect-source-actor kinoko34077 \
            --format html \
            --public-live \
            --public-json-out "$out/kaep/index.json" > "$out/kaep/index.html"
          rc=$?
          set -e
          # Status 2 is accepted ONLY with an explicit PARTIAL_UNKNOWN page.
          # A fully BLOCKED candidate search must never replace the live site.
          if [[ "$rc" != "0" && "$rc" != "2" ]]; then
            echo 'KAEP list output command failed'; exit 1
          fi
          python - "$out/kaep/index.html" "$rc" <<'PY'
          from pathlib import Path
          import re
          import sys
          path = Path(sys.argv[1])
          rc = int(sys.argv[2])
          content = path.read_text(encoding="ascii")
          assert 1000 < len(content) < 2000000
          assert content.startswith("<!doctype html>")
          match = re.search(r'<main data-source-status="([^"]+)">', content)
          assert match is not None
          status = match.group(1)
          assert status in ("BOUNDED_SEARCH_READ", "PARTIAL_UNKNOWN")
          assert (rc == 0) == (status == "BOUNDED_SEARCH_READ")
          assert "Content-Security-Policy" in content
          assert "connect-src https://api.github.com" in content
          assert 'id="live-update"' in content
          assert "credentials:\"omit\"" in content
          assert "github.com/kinoko34077/devflow/issues/" in content or "取得・検証時の注意" in content
          assert 'href="javascript:' not in content
          assert "https://api.github.com/repos/kinoko34077/devflow/issues/comments?" in content
          assert "PARTIAL / UNKNOWN" in content or status == "BOUNDED_SEARCH_READ"
          print("PUBLIC_KAEP_LIST_VALIDATED", status, "bytes", len(content))
          PY
          python - "$out/kaep/index.json" "$rc" <<'PY'
          import json, sys
          from pathlib import Path
          source = Path(sys.argv[1]).read_text(encoding="ascii")
          doc = json.loads(source)
          assert doc["schema_version"] == "kaep.public-source-index.v1"
          assert doc["kind"] == "NON_AUTHORITATIVE_CANDIDATE_SNAPSHOT"
          assert doc["status"] in ("BOUNDED_SEARCH_READ", "PARTIAL_UNKNOWN")
          assert (int(sys.argv[2]) == 0) == (doc["status"] == "BOUNDED_SEARCH_READ")
          assert doc["can_authorize_execution"] is False
          assert doc["complete_source_universe"] is False
          assert doc["fallback_retirement_authorized"] is False
          assert doc["requires_live_original_issue_revalidation"] is True
          assert "token" not in doc and "body" not in doc and "secret" not in doc
          assert all(row["source_url"].startswith(row["issue_url"] + "#issuecomment-")
                     for row in doc["rows"])
          print("PUBLIC_KAEP_AGENT_INDEX_VALIDATED", doc["status"], len(doc["rows"]))
          PY
          test "$(find "$out" -type f | wc -l)" -eq 7
          test "$(find "$out" -type l | wc -l)" -eq 0
      - name: Upload exact isolated artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/mobile-actions-public

  deploy:
    needs: build
    if: >-
      github.repository == 'kinoko34077/devflow' &&
      github.ref == 'refs/heads/main' &&
      github.actor_id == '79015263' &&
      github.triggering_actor == 'kinoko34077'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish public mobile-only site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
