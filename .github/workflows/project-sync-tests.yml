name: Required PR gate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'scripts/project_sync.py'
      - 'scripts/repository_bootstrap.py'
      - 'scripts/maintenance_audit.py'
      - 'tools/**'
      - 'tests/**'
      - 'features/**'
      - '.github/pull_request_template.md'
      - '.github/workflows/project-sync*.yml'
      - '.github/workflows/repository-bootstrap.yml'
      - '.github/workflows/maintenance-audit.yml'
      - '.devflow/WORKFLOW.yaml'
      - 'schemas/repository-bootstrap.v1.schema.json'
      - 'docs/project/**'
      - 'docs/operations/**'
      - 'docs/spec/**'
      - '.devflow/maintenance.yaml'
      - 'requirements-mcp.txt'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'
      - name: Install MCP runtime dependencies
        run: python -m pip install -r requirements-mcp.txt
      - name: Validate PR owner metadata
        if: github.event_name == 'pull_request'
        run: >-
          python -m tools.control_semantic_postmerge_event
          --validate-pr-owner-metadata
          --event-path "$GITHUB_EVENT_PATH"
          --repository "$GITHUB_REPOSITORY"
      - name: Unit tests
        run: python -W error -m unittest discover -v
      - name: Compile check
        run: >-
          python -m py_compile
          scripts/project_sync.py
          scripts/repository_bootstrap.py
          scripts/maintenance_audit.py
          tools/devflow_mcp_core.py
          tools/devflow_mcp.py
          tools/repository_bootstrap.py
          tools/workflow_contract.py
          tools/marker_json.py
          tools/github_issue_trust.py
          tools/repository_projection.py
          tools/task_checkpoint_cursor.py
          tools/maintenance_audit.py
          tools/maintenance_github.py
          tools/maintenance_triage.py
          tools/maintenance_sync_check.py
          tools/maintenance_supply.py
          tools/maintenance_catalog.py
          tools/maintenance_selector.py
