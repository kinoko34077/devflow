name: Required PR gate

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'scripts/project_sync.py'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/project-sync*.yml'
      - '.devflow/WORKFLOW.yaml'
      - 'docs/project/**'
      - 'docs/operations/DEVFLOW_MCP.md'
      - 'docs/spec/CROSS_REPOSITORY_DEVELOPMENT_CONTROL.md'
      - 'requirements-mcp.txt'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Unit tests
        run: python -W error -m unittest discover -v
      - name: Compile check
        run: python -m py_compile scripts/project_sync.py tools/devflow_mcp_core.py tools/devflow_mcp.py
