name: KAEP authenticated gh read path diagnostic (read-only)

# Explicitly fixed source scope; only PRs changing this diagnostic or manual.
on:
  pull_request:
    paths:
      - 'tools/kaep_gh_read_profile.py'
      - 'tests/test_kaep_gh_read_profile.py'
      - '.github/workflows/kaep-gh-read-profile.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  observe:
    if: >-
      github.repository == 'kinoko34077/devflow' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'
      - name: Read fixed KAEP sources via current gh API entrypoints; redact payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m tools.kaep_gh_read_profile --live
