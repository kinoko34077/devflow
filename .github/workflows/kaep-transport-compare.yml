name: KAEP bounded transport comparison (read-only)

on:
  workflow_dispatch:
    inputs:
      confirm_live_reads:
        description: Run the fixed 10-read comparison using the current Actions token
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  issues: read

jobs:
  compare:
    if: >-
      github.repository == 'kinoko34077/devflow' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.confirm_live_reads == true
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'
      - name: Compare fixed source reads; redact payloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m tools.kaep_transport_compare --live
