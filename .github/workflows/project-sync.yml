name: Project sync

on:
  issues:
    types: [opened, edited, reopened, closed]
  # Owner-authored Issue command is the native transport for ChatGPT clients
  # without workflow_dispatch OAuth access; no account-wide App key.
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only verify or repair drift from devflow
        type: choice
        required: true
        default: verify
        options:
          - verify
          - reconcile
      issue_number:
        description: Optional devflow issue number; blank means full scope
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  # Project fields and Sync Health are shared mutable surfaces across all Issues.
  # Serialize every event/manual mutator so scoped failure memory and Project
  # updates cannot race across different Issue numbers.
  group: project-sync
  queue: max
  cancel-in-progress: false

jobs:
  sync:
    # No Project secret or runner allocation for untrusted comments.
    # Identity is from GitHub's signed event payload, not comment text.
    if: >-
      github.event_name != 'issue_comment' ||
      (
        github.repository == 'kinoko34077/devflow' &&
        github.event.issue.pull_request == null &&
        github.event.issue.user.id == 79015263 &&
        github.event.comment.user.id == 79015263 &&
        github.event.sender.id == 79015263 &&
        (
          github.event.comment.body == '/kinotch sync verify' ||
          github.event.comment.body == '/kinotch sync reconcile'
        )
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Keep Sync Health issue closed
        if: github.event_name == 'issues' && github.event.issue.title == '[SYSTEM] GitHub Project Sync Health' && github.event.issue.state == 'open'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed

      - name: Sync issue event
        if: github.event_name == 'issues' && github.event.issue.title != '[SYSTEM] GitHub Project Sync Health'
        env:
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          MAINTENANCE_AUDIT_TOKEN: ${{ secrets.MAINTENANCE_AUDIT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/project_sync.py event-sync

      - name: Manual or approved owner-command verify/reconcile
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'issue_comment'
        env:
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          MAINTENANCE_AUDIT_TOKEN: ${{ secrets.MAINTENANCE_AUDIT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          # Fixed lookup only; never interpolate the comment body into shell.
          MODE: ${{ github.event_name == 'issue_comment' && (github.event.comment.body == '/kinotch sync verify' && 'verify' || 'reconcile') || inputs.mode }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        shell: bash
        run: |
          args=("$MODE")
          if [[ -n "$ISSUE_NUMBER" ]]; then
            args+=(--issue-number "$ISSUE_NUMBER")
          fi
          python scripts/project_sync.py "${args[@]}"
