name: Review readiness advisory

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  review-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Fetch PR and submitted reviews
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API_URL: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ["GH_TOKEN"]
          api_url = os.environ["GH_API_URL"].rstrip("/")
          repository = os.environ["GH_REPOSITORY"]
          pr_number = int(os.environ["PR_NUMBER"])
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get_json(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          pr_url = f"{api_url}/repos/{repository}/pulls/{pr_number}"
          pr = get_json(pr_url)

          reviews = []
          page = 1
          while True:
              query = urllib.parse.urlencode({"per_page": 100, "page": page})
              batch = get_json(f"{pr_url}/reviews?{query}")
              reviews.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          with open("/tmp/review-readiness-pr.json", "w", encoding="utf-8") as handle:
              json.dump(pr, handle)
          with open("/tmp/review-readiness-reviews.json", "w", encoding="utf-8") as handle:
              json.dump(reviews, handle)
          PY

      - name: Evaluate declared review readiness
        run: |
          python tools/review_readiness.py \
            --pr-json /tmp/review-readiness-pr.json \
            --reviews-json /tmp/review-readiness-reviews.json
