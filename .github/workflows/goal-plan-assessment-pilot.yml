name: Declared goal plan assessment pilot

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

# This pilot uses public anonymous GETs and has no repository token scope.
permissions: {}

jobs:
  assess-declared-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'
      - name: Fetch event-pinned public base without credentials
        env:
          REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --depth=1 origin "${BASE_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Assess declared source-bound plan effects with trusted base code
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if ! git cat-file -e "${BASE_SHA}:tools/goal_plan_assessment.py" 2>/dev/null; then
            echo "GOAL_PLAN_CHECK=SKIPPED_EVALUATOR_NOT_ON_BASE"
            exit 0
          fi
          python -m tools.goal_plan_assessment
      - name: Check optional declared outcome packet with trusted base code
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if ! git cat-file -e "${BASE_SHA}:tools/outcome_observation_pilot.py" 2>/dev/null; then
            echo "OUTCOME_PILOT=SKIPPED_EVALUATOR_NOT_ON_BASE"
            exit 0
          fi
          python -m tools.outcome_observation_pilot
