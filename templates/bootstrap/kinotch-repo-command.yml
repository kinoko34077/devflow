name: KiNoTch repository command (read-only baseline)

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  status:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.issue.user.id == 79015263 &&
      github.event.comment.user.id == 79015263 &&
      github.event.sender.id == 79015263 &&
      github.event.comment.body == '/kinotch status'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Read repository metadata and installed standard capabilities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY" --jq '{repository: .full_name, default_branch: .default_branch, private: .private}'
          if features_base64="$(gh api "repos/$GITHUB_REPOSITORY/contents/.devflow/standard-features.json" --jq '.content' 2>/dev/null)"; then
            printf '%s' "$features_base64" | base64 --decode | jq '{schema, repository, standard_features, features}'
          else
            echo 'standard_features=UNKNOWN_OR_NOT_INSTALLED'
          fi
