schema_version: 4
repository:
  operational_name: devflow
  current_github_identity: kinoko34077/devflow
  previous_github_identity: kinoko34077/devflow-test
  rename_state: completed

canonical_operational_state:
  issues: true
  pull_requests: true
  repository_control_issues: true
  github_project_is_display_only: true
  repository_files_duplicate_issue_state: false
  chat_history_is_canonical: false

agent_bootstrap:
  entry_file: AGENTS.md
  normal_managed_repository_read_order:
    - devflow_agent_entry
    - target_repository_control_issue
    - target_repository_local_entry_points
    - active_repository_local_issue_or_pull_request
    - task_relevant_specs_code_tests
    - cross_repository_spec_when_needed
  control_issue_title_pattern: "[REPO] <repository>"
  require_exactly_one_open_control_issue: true
  no_control_issue_action: onboard_before_normal_implementation
  duplicate_control_issue_action: reconcile_before_state_mutation
  base_adopted_local_entry:
    - AGENTS.md
    - project/project.json
    - project/docs/INDEX.md
    - project/docs/CURRENT_STATE.md
    - task_relevant_material
  force_base_layout_on_non_base_repository: false

workflow:
  work_states:
    - NEEDS_AUDIT
    - AUDITED
    - WORK_ORDER_READY
    - READY_FOR_IMPLEMENTATION
    - IMPLEMENTING
    - AWAITING_REVIEW
    - BLOCKED
    - NEEDS_REAUDIT
    - PARKED
    - DONE
  repository_states:
    - ACTIVE
    - PARKED
    - MAINTENANCE
    - DEPRECATED
    - CANCELLED
  priorities:
    - P0
    - P1
    - P2
    - P3
  risks:
    - LOW
    - MEDIUM
    - HIGH
    - CRITICAL
  types:
    - FEATURE
    - BUG
    - SPEC
    - AUDIT
    - REFACTOR
    - MAINTENANCE
    - RESEARCH
    - INFRA
    - DOCS
  next_action_tags:
    - AUDIT
    - SPECIFY
    - IMPLEMENT
    - VERIFY
    - REVIEW
    - MERGE
    - RELEASE
    - USER_DECISION
    - WAIT
    - NONE

standing_maintenance:
  authority: devflow#363
  adoption: PILOT
  rollout_values:
    - DISABLED
    - PILOT
    - ENABLED
  bootstrap_v1_classifier_unchanged: true
  generic_broad_pickup_order:
    - recoverable_work
    - normal_runnable_work
    - predefined_maintenance
    - alternate_or_deeper_maintenance
    - portfolio_maintenance
    - NO_ELIGIBLE_WORK
  publication_flow:
    - normal_bootstrap
    - standing_maintenance_after_no_eligible_work
    - publish_under_attempt_a
    - fresh_attempt_b_bootstrap
    - serialized_claim_and_acknowledge
    - exact_ledger_run
    - true_no_eligible_work_after_maintenance_exhaustion
  repository_scope_auto_widen: forbidden
  same_attempt_consume_after_publish: forbidden
  publication_requires_new_execution_attempt: true
  fresh_execution_attempt_required_after_publish: true
  true_no_eligible_work_requires_maintenance_exhausted: true
  same_attempt_omission_reason: PUBLISHED_BY_THIS_ATTEMPT
  claim_authority: execution-coordinator
  catalog_is_task_definition_not_claim_authority: true
  synthetic_idle_work: forbidden

compatibility:
  legacy_work_states_read_only:
    - NEW
    - VERIFIED
    - SPEC_CHANGED
  legacy_mapping:
    NEW: NEEDS_AUDIT
    VERIFIED: AWAITING_REVIEW
    SPEC_CHANGED: NEEDS_REAUDIT

issue_authority:
  repository_control:
    owner: devflow
    purpose: cross_repository_index_and_current_state_summary
    detailed_implementation_record: false
  cross_repository_work_order:
    owner: devflow
    use_when:
      - coordinated_multi_repository_operation
      - control_plane_or_workflow_change
      - project_or_sync_structure_change
      - one_shared_acceptance_decision
  repository_local_issue_or_work_order:
    owner: target_repository
    use_when:
      - repository_specific_implementation
      - repository_specific_investigation
      - repository_specific_finding
      - repository_specific_specification_change
    identical_template_required: false
  pull_request:
    owner: target_repository
    purpose: diff_review_and_verification_evidence
    normal_review_boundary: true

repository_control:
  control_only_wait_source_state:
    value: WAIT
    allowed_only_for_repository_control: true
    meaning: no_currently_runnable_or_active_repository_local_work
    general_work_state: false
    project_status_projection: PARKED
    repository_state_unchanged: true
    next_action_must_name_wait_condition: true
    authority: devflow#162
  one_open_issue_per_managed_repository: true
  excluded_repositories:
    - pc-files
    - pc-files2
  required_fields:
    - repository
    - work_status
    - type
    - repository_state
    - priority
    - risk
    - audit_sha
    - active_work
    - next_action
    - detailed_current_state
    - canonical_entry_points
  update_when:
    - accepted_audit_sha_changes
    - accepted_audit_provenance_changes
    - work_status_changes
    - repository_state_changes
    - cross_repository_priority_or_risk_changes
    - active_work_reference_changes
    - next_action_changes
    - canonical_entry_points_change
    - p0_or_p1_finding_changes_readiness
    - managed_lifecycle_state_changes
  do_not_update_for:
    - every_commit
    - repeated_test_with_same_outcome
    - minor_implementation_comment
    - local_detail_without_cross_repository_state_change

  audit_provenance:
    machine_owned: true
    latest_fields:
      - audit_sha
      - audit_ref
      - last_audit_at
      - audit_depth
      - audit_scope
      - audit_evidence
      - last_deep_audit_at
    audit_depths:
      - CONTROL
      - STANDARD
      - DEEP
    derived_freshness:
      values:
        - CURRENT
        - DRIFTED
        - UNKNOWN
      compare: audit_sha_to_explicit_audit_ref_head
      missing_or_unresolvable_audit_ref: UNKNOWN
      default_branch_guess_when_ref_missing: false
    historical_backfill:
      infer_timestamp_from_commit_time: false
      infer_depth_from_work_status: false
      require_exact_evidence: true

repository_local_issue:
  durable_tracking_expected_when:
    - work_spans_sessions_or_multiple_commits
    - acceptance_criteria_must_survive_handoff
    - p0_or_p1_finding
    - blocked_or_user_decision_required
    - multiple_local_components_need_fixed_scope
    - dependency_tracking_required
    - lasting_decision_or_verification_history_required
  trivial_single_pr_issue_optional: true
  required_information_when_no_local_template:
    - source_or_reason
    - objective_or_problem
    - scope
    - acceptance_criteria
    - verification
    - audit_or_base_sha
    - related_specs_or_decisions
    - implementation_references
    - blocker_or_next_action_when_unfinished

required_work_order_fields:
  - source
  - type
  - work_status
  - priority
  - risk
  - repository
  - objective
  - scope
  - acceptance_criteria
  - non_goals
  - verification
  - audit_base
  - related_specs_or_decisions

operating_lifecycle:
  normal_repository_work:
    - read_control_and_local_canon
    - audit_relevant_current_sha
    - create_or_reuse_local_issue_when_durable_tracking_warranted
    - dedicated_branch
    - implementation
    - verification_and_regression
    - pull_request
    - re_audit_changed_scope
    - merge_under_safety_policy
    - reconcile_repository_local_canon
    - reconcile_devflow_control_if_summary_changed
  full_audit_periodic: false
  finding_escalation:
    p0_p1: durable_issue_by_default
    p2_p3: summarize_by_default

merge_boundary:
  default_branch_direct_write: false
  low_or_medium_risk_merge_without_new_confirmation_requires:
    - existing_user_authorization
    - current_verification_evidence
    - low_catastrophic_failure_potential
    - no_unresolved_security_or_destructive_boundary
    - safe_revert_pr_available
  explicit_user_confirmation_required_for:
    - release
    - deploy
    - publication
    - destructive_delete
    - shared_history_rewrite
    - credential_or_session_change
    - permission_change
    - other_security_sensitive_action
    - difficult_to_reverse_action
  rollback: dedicated_branch_and_revert_pr
  rewrite_shared_main_for_rollback: false

handoff:
  canonical_resume_sources:
    - repository_control_issue
    - referenced_repository_local_issue_or_work_order
    - accepted_task_checkpoint_cursor_when_eligible
    - designated_durable_progress_surface
    - referenced_pull_request
    - recorded_audit_sha_vs_current_head
    - repository_local_specs_and_current_state
    - first_acceptance_condition_without_current_evidence
  previous_chat_required: false
  devflow_summary_conflict_with_local_canon: reconcile_devflow_from_verified_local_canon
  ambiguous_local_canon_conflict: resolve_before_implementation

chat_rollover_archive:
  schema_version: 2
  standing_policy_issue: "kinoko34077/devflow#361"
  operations_doc: docs/operations/CHAT_ROLLOVER_ARCHIVE.md
  canonical_command: "kinoko34077/devflow#361を読んで、このチャット全体を議事録化し、後続チャット用資料を作成"
  canonical_command_requires_issue_lookup_first: true
  legacy_shorthand: "ガイドライン読んで引き継ぎ"
  legacy_shorthand_status: ambiguous_not_preferred
  trigger_match: exact_command_preferred_semantic_equivalent_allowed_when_action_direction_is_explicit
  operation_role: current_worker_records_current_chat_and_creates_successor_material_not_resume_or_takeover
  current_state_authority: false
  live_canon_must_be_reconciled_first: true
  canonical_new_issue_prefixes:
    minutes: "[MINUTES]"
    handoff: "[HANDOFF]"
  separate_minutes_and_handoff_issues: true
  historical_combined_record_titles_remain_valid: true
  routing:
    single_repository: one_pair_in_target_repository
    multi_repository: one_pair_per_substantive_repository_owner
    cross_repository_control_plane: devflow_pair_for_cross_repository_owned_material
    incidental_repository_mentions_create_pair: false
    no_valid_owner_action: report_placement_ambiguity_do_not_invent_repository
  conversation_scope:
    minutes: all_accessible_substantive_repository_relevant_current_chat_content
    inaccessible_or_truncated_content: disclose_gap_do_not_fabricate
    live_github_evidence_may_reconstruct_current_state_not_lost_chat_wording: true
  duplicate_handling:
    search_open_and_closed_archival_records: true
    update_existing_pair_when_unambiguous: true
    create_missing_mate_when_single_side_unambiguous: true
    ambiguous_identity_action: create_new_pair_do_not_merge_unrelated_records
  required_pair_linkage:
    reciprocal_issue_links: true
    shared_archive_pair_id: true
    conversation_title_at_start_when_available: true
    execution_session_id_when_available: true
  before_finalization:
    reconcile_owning_issue_or_work_order: true
    reconcile_designated_durable_progress_surface: true
    reconcile_task_checkpoint_cursor_when_eligible: true
    reconcile_execution_session: true
    reconcile_current_state_only_if_accepted_repository_state_changed: true
    reconcile_repository_control_only_if_cross_repository_summary_changed: true
  archive_issue_default_lifecycle: close_completed_after_finalization
  unfinished_work_owner: owning_issue_or_work_order_not_archival_handoff

task_checkpoint_cursor:
  status: required_when_eligible_single_frontier
  schema_version: 1
  sentinel: "<!-- devflow-task-checkpoint-cursor:v1 -->"
  storage: trusted_owning_issue_comment
  role: roadmap_and_current_frontier_projection
  detailed_progress_owner: designated_durable_progress_surface
  pairs_with_durable_progress_surface: true
  designated_progress_surface_must_be_discovered_and_consumed: true
  user_reminder_required_for_progress_surface_or_cursor: false
  first_unfinished_projection: true
  single_frontier_only: true
  mandatory_when_eligible_single_frontier: true
  mandatory_for_all_durable_progress: false
  dedicated_progress_issue_allowed: true
  cursor_evidence_should_reference_progress_surface_when_practical: true
  ordinary_drift_action: warn_reread_and_reconcile_both_layers
  readiness_authority: false
  claim_lease_fencing_authority: false
  fallback_without_cursor:
    eligible_single_frontier: reconcile_or_initialize_from_designated_progress_before_next_material_unit
    parallel_or_ambiguous_frontier: designated_durable_progress_surface
  operations_doc: docs/operations/TASK_CHECKPOINT_CURSOR.md

project_display:
  source_of_truth: false
  preferred_update_direction: canonical_state_to_project
  direct_manual_update_is_normal_operation: false
  project_owner: kinoko34077
  project_number: 1
  project_title: KiNoTch. Development Control
  work_status_field: Status
  work_status_field_kind: builtin_project_status
  duplicate_custom_work_status_field: false
  field_mapping:
    work_status: Status
    repository_state: Repository State
    priority: Priority
    risk: Risk
    type: Work Type
    repository: Managed Repository
    next_action: Next Action
    audit_sha: Audit SHA
    audit_ref: Audit Ref
    last_audit_at: Last Audit
    audit_depth: Audit Depth
    audit_scope: Audit Scope
    audit_evidence: Audit Evidence
    last_deep_audit_at: Last Deep Audit
  derived_field_mapping:
    audit_freshness: Audit Freshness
  derived_issue_projection:
    audit_freshness:
      authority: scripts/project_sync.py::derive_audit_freshness
      canonical: false
      machine_owned: true
      transport: repository_control_label
      labels:
        CURRENT: devflow:audit-freshness:current
        DRIFTED: devflow:audit-freshness:drifted
        UNKNOWN: devflow:audit-freshness:unknown
      exactly_one_label_when_audit_sha_present: true
      control_body_field: false
      consumer_rederivation_allowed: false
  builtin_repository_is_issue_owner_only: true
  required_views:
    - Repository Overview
    - Work Queue
  enabled_project_workflows:
    - auto_add:
        repository: kinoko34077/devflow
        filter: is:issue is:open
    - issue_closed:
        status: DONE
  disabled_project_workflows:
    - auto_close_issue
    - auto_add_sub_issues
    - pull_request_linked_to_issue
    - item_added
    - pull_request_merged
    - auto_archive
    - code_changes_requested
    - code_review_approved
    - item_reopened

project_sync:
  implementation: present
  live_state: operational
  work_order: 39
  workflow_file: .github/workflows/project-sync.yml
  implementation_file: scripts/project_sync.py
  operations_doc: docs/project/PROJECT_SYNC.md
  secret_name: PROJECTS_TOKEN
  cross_repository_read_secret_name: MAINTENANCE_AUDIT_TOKEN
  event_modes:
    - event-sync
  manual_modes:
    - verify
    - reconcile
  schedule: none
  health_issue_title: "[SYSTEM] GitHub Project Sync Health"
  health_issue_sync_to_project: false
  runtime_id_discovery: true
  project_to_issue_reverse_sync: false
  direct_project_verification:
    routine_when_health_passes: false
    required_for:
      - structural_project_change
      - api_invisible_requirement
      - machine_ui_disagreement
      - ambiguous_project_discovery
      - owner_or_field_migration
      - repository_identity_migration
      - explicit_user_request

repository_bootstrap:
  contract_schema: repository-bootstrap.v1
  canonical_spec: docs/spec/REPOSITORY_BOOTSTRAP.md
  operations_doc: docs/operations/REPOSITORY_BOOTSTRAP.md
  workflow_file: .github/workflows/repository-bootstrap.yml
  implementation_file: tools/repository_bootstrap.py
  cli_file: scripts/repository_bootstrap.py
  request_issue_title_pattern: "[REPO CREATE] <repository-name>"
  request_authority: finite_creation_request_and_recovery_record
  resulting_control_title_pattern: "[REPO] <repository-name>"
  resulting_control_authority: cross_repository_current_state_summary
  executor_semantics: deterministic_no_llm
  idempotency: ensure_or_fail_closed
  required_template_v1: minimal
  safe_defaults:
    visibility: private
    devflow_managed_unless_excluded: true
    license: null
    force_repository_base: false
  visibility_selection:
    allowed:
      - private
      - public
    explicit_context_choice: preserve
    interactive_unspecified_action: ask_user_before_request
    noninteractive_or_delegated_unspecified_fallback: private
    infer_public_from_prose: forbidden
  trusted_author_associations:
    - OWNER
    - MEMBER
    - COLLABORATOR
  secret_boundary:
    name: REPOSITORY_BOOTSTRAP_TOKEN
    validation_job_receives_secret: false
    provisioning_requires_valid_request: true
    provisioning_requires_trusted_author: true
    credential_creation_rotation_storage_permission_change: human_confirmation
  operational_e2e:
    credential_required: true
    current_status: pending_approved_credential
    test_visibility: private
    automatic_cleanup_delete: false

repository_rename:
  previous: kinoko34077/devflow-test
  current: kinoko34077/devflow
  state: completed
  phase_a_rename_ready:
    - logical_name_devflow
    - retain_explicit_current_identity_where_required
    - classify_old_name_references
    - remove_unnecessary_runtime_literal_dependency
  phase_b_acceptance_after_admin_rename:
    - verify_repository_identity
    - verify_issues_pull_requests_actions_default_branch
    - verify_branch_protection_and_required_configuration
    - verify_project_auto_add_repository_identity
    - full_project_reconcile
    - full_project_verify
    - require_sync_health_full_coverage_zero_drift_zero_errors
    - update_current_identity_references_and_control_audit_sha

review_boundary: pull_request
implementation_actor: unrestricted
